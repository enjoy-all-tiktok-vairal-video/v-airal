    <style>
        /* আপনার দেওয়া সব অরিজিনাল CSS এখানে রাখা হয়েছে */
        * { -webkit-user-select: none !important; user-select: none !important; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; background: #050505; font-family: 'Segoe UI', Arial, sans-serif; color: white; overflow-x: hidden; }
        .header { display: flex; justify-content: space-between; align-items: center; padding: 15px; background: rgba(10, 10, 10, 0.9); position: sticky; top: 0; z-index: 1000; backdrop-filter: blur(15px); border-bottom: 1px solid #222; }
        .logo { font-size: 22px; font-weight: bold; color: #ff0000; animation: logoElastic 3.5s infinite; }
        @keyframes logoElastic { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.1); color: #fff; } }
        .search { padding: 10px 15px; border-radius: 25px; border: 2.5px solid #333; background: #1a1a1a; color: white; width: 45%; outline: none; animation: rainbowBorder 4s linear infinite; }
        @keyframes rainbowBorder { 0% { border-color: #ff0000; } 50% { border-color: #00ffff; } 100% { border-color: #ff0000; } }
        .container { padding: 15px; margin-bottom: 80px; }
        .section-title { font-size: 18px; margin: 25px 0 15px; border-left: 4px solid #ff0000; padding-left: 12px; font-weight: bold; }
        .slider-container { display: flex; overflow-x: auto; gap: 15px; padding-bottom: 15px; scrollbar-width: none; }
        .slide-card { min-width: 135px; height: 195px; border-radius: 12px; overflow: hidden; border: 1px solid #333; flex-shrink: 0; position: relative; }
        .slide-card img { width: 100%; height: 100%; object-fit: cover; }
        .video-grid { display: grid; grid-template-columns: 1fr; gap: 30px; max-width: 500px; margin: auto; }
        .card { background: #121212; border-radius: 20px; overflow: hidden; border: 1px solid #252525; }
        .card img { width: 100%; }
        .button { padding: 14px; background: linear-gradient(90deg, #ff0000, #800000); border: none; color: white; width: 100%; border-radius: 12px; font-weight: 800; cursor: pointer; }
        .neon-highlight-card { animation: neonPulsate 1.5s infinite alternate; border: 3px solid #ff0000 !important; }
        @keyframes neonPulsate { 0% { box-shadow: 0 0 20px #ff0000; } 100% { box-shadow: 0 0 20px #00ffff; } }
        .nav { position: fixed; bottom: 0; width: 100%; background: #0a0a0a; display: flex; justify-content: space-around; padding: 15px 0; border-top: 1px solid #222; }
        .nav a { color: #555; text-decoration: none; font-size: 12px; }
        .cat-btn.active { background: #ff0000; padding: 8px 15px; border-radius: 20px; color: white; }
    </style>
</head>
<body oncontextmenu="return false;">

<div class="header">
    <div class="logo">ENJOY ALL</div>
    <input type="text" class="search" placeholder="Search Code..." id="searchInput">
</div>

<div class="container">
    <div id="searchResult"></div>
    <div class="section-title">Featured</div>
    <div id="topSlider" class="slider-container"></div>

    <div class="section-title">Categories</div>
    <div class="cat-box" style="display: flex; gap: 10px; overflow-x: auto; margin-bottom: 20px;">
        <button class="cat-btn active" onclick="filterCat('all', this)">All Episodes</button>
        <button class="cat-btn" onclick="filterCat('tiktok', this)">TikTok Viral</button>
    </div>

    <div class="video-grid" id="allVideos"></div>
</div>

<div class="nav">
    <a href="index.html" class="active">🏠 Home</a>
    <a href="profile.html">👤 Profile</a>
    <a href="support.html">🛠 Support</a>
</div>

<script>
const tg = window.Telegram.WebApp;
tg.ready(); tg.expand();

let adStatus = {};

// ডাইনামিক কিউ তৈরি (Config অনুযায়ী)
function createAdQueue() {
    let q = [];
    for(let i=0; i<AD_CONFIG.adsgramCount; i++) q.push('adsgram');
    for(let i=0; i<AD_CONFIG.monetagCount; i++) q.push('monetag');
    for(let i=0; i<AD_CONFIG.directLinkCount; i++) q.push('direct');
    return q;
}

function startUnlock(code) {
    if (!adStatus[code]) {
        adStatus[code] = { rem: AD_CONFIG.requiredAdCount, list: createAdQueue() };
    }
    const btn = document.getElementById(`btn-${code}`) || document.getElementById(`btn-s-${code}`);
    const currentAd = adStatus[code].list[AD_CONFIG.requiredAdCount - adStatus[code].rem];

    if (currentAd === 'adsgram') {
        const id = AD_CONFIG.adsgramIds[Math.floor(Math.random() * AD_CONFIG.adsgramIds.length)];
        if (window.Adsgram) {
            window.Adsgram.init({ blockId: id }).show().then(() => handleAds(code, btn)).catch(() => showFallbackMonetag(code, btn));
        } else { showFallbackMonetag(code, btn); }
    } else if (currentAd === 'monetag') {
        showFallbackMonetag(code, btn);
    } else if (currentAd === 'direct') {
        window.open(AD_CONFIG.myDirectLink, '_blank');
        handleAds(code, btn);
    }
}

function showFallbackMonetag(code, btn) {
    const zone = AD_CONFIG.monetagZones[Math.floor(Math.random() * AD_CONFIG.monetagZones.length)];
    if (typeof window[`show_${zone}`] === 'function') {
        window[`show_${zone}`]().then(() => handleAds(code, btn)).catch(() => handleAds(code, btn));
    } else { handleAds(code, btn); }
}

function handleAds(code, btn) {
    adStatus[code].rem--;
    if (adStatus[code].rem > 0) {
        btn.innerText = `🔒 UNLOCK (${adStatus[code].rem} ADS LEFT)`;
    } else {
        if(window.db) {
            window.runTransaction(window.ref(window.db, `stats/${code}`), (data) => {
                if (!data) data = { v: 0, down: 0 };
                data.v = (data.v || 0) + 1;
                return data;
            });
        }
        btn.innerText = "▶ PLAY VIDEO";
        btn.style.background = "#28a745";
        btn.onclick = () => { window.location.href = videos[code].final; };
    }
}

function filterCat(type, btn) {
    if(btn) {
        document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
    }
    const grid = document.getElementById("allVideos");
    grid.innerHTML = "";
    Object.keys(videos).forEach(code => {
        const v = videos[code];
        if (type === 'all' || v.cat === type) {
            grid.insertAdjacentHTML('beforeend', `
                <div class="card" id="card-${code}">
                    <img src="${v.image}">
                    <div style="padding:15px;">
                        <h3>${v.title}</h3>
                        <div style="font-size:11px; color:#888; margin-bottom:10px;">ID: ${code}</div>
                        <button class="button" onclick="startUnlock('${code}')" id="btn-${code}">🔒 UNLOCK (${AD_CONFIG.requiredAdCount} ADS)</button>
                    </div>
                </div>`);
        }
    });
}

function triggerSearch(val) {
    const res = document.getElementById("searchResult");
    const code = val.trim().toUpperCase();
    if (!code || !videos[code]) { res.style.display="none"; return; }
    res.style.display="block";
    const v = videos[code];
    res.innerHTML = `
        <div class="card neon-highlight-card">
            <img src="${v.image}">
            <div style="padding:15px;">
                <h3>${v.title}</h3>
                <button class="button" onclick="startUnlock('${code}')" id="btn-s-${code}">🔒 UNLOCK (${AD_CONFIG.requiredAdCount} ADS)</button>
            </div>
        </div>`;
    res.scrollIntoView({ behavior: 'smooth' });
}

function init() {
    const slider = document.getElementById("topSlider");
    Object.keys(videos).slice(0, 10).forEach(code => {
        slider.innerHTML += `<div class="slide-card" onclick="startUnlock('${code}')"><img src="${videos[code].image}"></div>`;
    });
    filterCat('all');
}

let check = setInterval(() => { if (typeof videos !== 'undefined') { clearInterval(check); init(); } }, 500);
document.getElementById("searchInput").addEventListener("input", function() { triggerSearch(this.value); });
</script>
</body>
</html>

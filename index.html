    <style>
    * { -webkit-user-select: none !important; -ms-user-select: none !important; user-select: none !important; -webkit-tap-highlight-color: transparent; }
    body { margin: 0; background: #050505; font-family: 'Segoe UI', Arial, sans-serif; color: white; scroll-behavior: smooth; overflow-x: hidden; touch-action: pan-y; }
    .header { display: flex; justify-content: space-between; align-items: center; padding: 15px; background: rgba(10, 10, 10, 0.9); position: sticky; top: 0; z-index: 1000; backdrop-filter: blur(15px); border-bottom: 1px solid #222; }

    @keyframes neonPulsate { 0% { border-color: #ff0000; box-shadow: 0 0 20px #ff0000; } 100% { border-color: #00ffff; box-shadow: 0 0 20px #00ffff; } }
    .container { padding: 15px; margin-bottom: 80px; }
    .section-title { font-size: 18px; margin: 25px 0 15px; border-left: 4px solid #ff0000; padding-left: 12px; font-weight: bold; text-transform: uppercase; letter-spacing: 1px; }
    .slider-container { display: flex; overflow-x: auto; gap: 15px; padding-bottom: 15px; scrollbar-width: none; }
    .slide-card { min-width: 135px; height: 195px; position: relative; border-radius: 12px; overflow: hidden; border: 1px solid #333; flex-shrink: 0; }

    .cat-btn { background: #111; color: #fff; padding: 10px 22px; border-radius: 30px; font-size: 13px; cursor: pointer; white-space: nowrap; transition: 0.4s; font-weight: 700; border: 2.5px solid #333; text-transform: uppercase; }
    .active-cat-title { text-align: center; font-size: 22px; font-weight: 900; margin: 15px 0 25px; text-transform: uppercase; letter-spacing: 2px; color: #ff0000; }
    .video-grid { display: grid; grid-template-columns: 1fr; gap: 30px; max-width: 500px; margin: auto; }
    .card { background: #121212; border-radius: 20px; overflow: hidden; border: 1px solid #252525; position: relative; box-shadow: 0 10px 30px rgba(0,0,0,0.5); transition: 0.4s; cursor: pointer; }

    .button { padding: 14px; background: linear-gradient(90deg, #ff0000, #800000); border: none; color: white; width: 100%; border-radius: 12px; font-size: 15px; font-weight: 800; cursor: pointer; text-transform: uppercase; margin-bottom: 12px; transition: 0.3s; }
    .share-row { display: flex; justify-content: center; gap: 8px; margin-top: 5px; }
    .s-btn { flex: 1; padding: 10px 2px; font-size: 11px; font-weight: bold; border-radius: 8px; color: #ffffff !important; border: 1.5px solid rgba(255,255,255,0.3); cursor: pointer; text-align: center; text-decoration: none; }
    .btn-link { background: #444444 !important; } 
    .btn-fb { background: #1877F2 !important; }

    .nav { position: fixed; bottom: 0; width: 100%; background: rgba(10, 10, 10, 0.95); display: flex; justify-content: space-around; padding: 15px 0; border-top: 1px solid #222; z-index: 1000; }
    .nav a { color: #555; text-decoration: none; font-size: 12px; text-align: center; }

<body oncontextmenu="return false;">

<div class="header">
    <div class="logo">ENJOY ALL</div>
    <input type="text" class="search" placeholder="Search Code..." id="searchInput">
</div>

<div class="container">
    <div id="searchResult"></div>
    <div id="featuredArea">
        <div class="section-title">Featured <span style="float:right; font-size:11px; color:#666;">Top 15 New</span></div>
        <div class="slider-container" id="topSlider"></div>
    </div>
    <div class="section-title">Categories</div>
    <div class="cat-box">
        <button class="cat-btn active" onclick="filterCat('all', this)">All Episodes</button>
        <button class="cat-btn" onclick="filterCat('tiktok', this)">TikTok Viral</button>
        <button class="cat-btn" onclick="filterCat('others', this)">Others Link</button>
    </div>

    <div id="selectedCatName" class="active-cat-title">ALL EPISODES</div>
    <div class="video-grid" id="allVideos"></div>
</div>

<div class="nav">
    <a href="index.html" class="active">🏠 Home</a>
    <a href="browser.html">🌐 Browser</a>
    <a href="profile.html">👤 Profile</a>
    <a href="support.html">🛠 Support</a>
</div>

<script>
const tg = window.Telegram.WebApp;
tg.ready();
tg.expand();

let adCounts = {};

// সংখ্যাকে K ফরম্যাটে নেওয়ার ফাংশন
function formatK(num) {
    if (num >= 1000000) return (num / 1000000).toFixed(1).replace(/\.0$/, '') + 'M';
    if (num >= 1000) return (num / 1000).toFixed(1).replace(/\.0$/, '') + 'k';
    return num || 0;
}

// অ্যাড এবং ডাইরেক্ট লিঙ্ক হ্যান্ডলিং
function startUnlock(code) {
    if (!adCounts[code]) {
        let adsList = [];
        let aCount = AD_CONFIG.adsgramCount;
        let mCount = AD_CONFIG.monetagCount;
        
        for (let i = 0; i < (aCount + mCount); i++) {
            if (i % 2 === 0 && aCount > 0) { adsList.push('adsgram'); aCount--; }
            else if (mCount > 0) { adsList.push('monetag'); mCount--; }
            else if (aCount > 0) { adsList.push('adsgram'); aCount--; }
        }
        
        adCounts[code] = {
            totalAds: AD_CONFIG.adsgramCount + AD_CONFIG.monetagCount,
            doneAds: 0,
            doneDirect: 0,
            queue: adsList
        };
    }

    const data = adCounts[code];
    const btn = document.getElementById(`btn-${code}`) || document.getElementById(`btn-s-${code}`);

    // ১. প্রথমে সব সাধারণ অ্যাড দেখানো হবে
    if (data.doneAds < data.totalAds) {
        const network = data.queue[data.doneAds];
        if (network === 'adsgram') {
            window.Adsgram.init({ blockId: AD_CONFIG.adsgramIds[0] }).show().then(() => {
                data.doneAds++;
                updateBtn(code, btn);
            }).catch(() => tg.showAlert("Ad failed, try again."));
        } else {
            const mZones = AD_CONFIG.monetagZones;
            const zone = mZones[data.doneAds % mZones.length];
            if (window[`show_${zone}`]) {
                window[`show_${zone}`]().then(() => {
                    data.doneAds++;
                    updateBtn(code, btn);
                }).catch(() => { data.doneAds++; updateBtn(code, btn); });
            } else { data.doneAds++; updateBtn(code, btn); }
        }
    } 
    // ২. অ্যাড শেষ হলে ডাইরেক্ট লিঙ্ক (যদি সংখ্যা ১ বা ২ থাকে)
    else if (data.doneDirect < AD_CONFIG.directLinkCount) {
        window.open(AD_CONFIG.myDirectLink, '_blank');
        data.doneDirect++;
        updateBtn(code, btn);
    } 
    // ৩. সব শেষ হলে প্লে
    else {
        showFinalPlay(code, btn);
    }
}

function updateBtn(code, btn) {
    const data = adCounts[code];
    const remAds = data.totalAds - data.doneAds;
    const remDirect = AD_CONFIG.directLinkCount - data.doneDirect;

    if (remAds > 0) {
        btn.innerText = `🔒 UNLOCK (${remAds} ADS LEFT)`;
    } else if (remDirect > 0) {
        btn.innerText = `⚡ VERIFY (${remDirect} STEP LEFT)`;
        btn.style.background = "linear-gradient(90deg, #f59e0b, #d97706)";
    } else {
        showFinalPlay(code, btn);
    }
}

function showFinalPlay(code, btn) {
    if(window.db) {
        window.runTransaction(window.ref(window.db, `stats/${code}`), (s) => {
            if (!s) s = { v: 0, down: 0, l: 0, d: 0 };
            s.v++; s.down++; return s;
        });
    }
    btn.innerText = "▶ PLAY NOW";
    btn.style.background = "linear-gradient(90deg, #10b981, #059669)";
    btn.onclick = () => { window.location.href = videos[code].final; };
}

// সার্চ এবং অটো স্ক্রোল লজিক
function triggerSearch(val) {
    const resultDiv = document.getElementById("searchResult");
    if (typeof videos === 'undefined') return;
    const searchVal = val.trim().toUpperCase();
    if (!searchVal || !videos[searchVal]) {
        resultDiv.style.display = "none";
        return;
    }
    resultDiv.style.display = "block";
    const v = videos[searchVal];
    const shareLink = `${AD_CONFIG.botUrl}?startapp=${searchVal}`;
    
    // কার্ড তৈরি
    resultDiv.innerHTML = `
        <div class='card neon-highlight-card' id='search-card-${searchVal}' style='margin-bottom:30px;'>
            <div class="card-img-box"><img src="${v.image}"></div>
            <div class='card-info'>
                <h3 style="color:#ff0000; font-size:12px;">⚡ DIRECT MATCH FOUND</h3>
                <h3>${v.title}</h3>
                <div class="meta-row">
                    <span>📅 ${v.date || 'New'}</span>
                    <span class="id-badge" onclick="copyId('${searchVal}')"># ID: ${searchVal} 📋</span>
                </div>
                <div class="stats-bar">
                    <div class="stat-group">
                        <div class="stat-item">👁️ <span id="sv-${searchVal}">0</span></div>
                        <div class="stat-item">📥 <span id="sdn-${searchVal}">0</span></div>
                    </div>
                </div>
                <button class='button' onclick="startUnlock('${searchVal}')" id="btn-s-${searchVal}">🔒 UNLOCK (${AD_CONFIG.requiredAdCount} ADS)</button>
                <div class="share-row">
                    <button class="s-btn btn-link" onclick="copyLink('${searchVal}')">Get Link</button>
                    <a class="s-btn btn-fb" href="https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(shareLink)}" target="_blank">Facebook</a>
                    <a class="s-btn btn-wa" href="https://api.whatsapp.com/send?text=${encodeURIComponent(shareLink)}" target="_blank">WhatsApp</a>
                </div>
            </div>
        </div>`;
    
    // ভিউ কাউন্ট আপডেট
    if(window.db) {
        window.onValue(window.ref(window.db, `stats/${searchVal}`), (snap) => {
            const d = snap.val(); if(d){
                document.getElementById(`sv-${searchVal}`).innerText = formatK(d.v);
                document.getElementById(`sdn-${searchVal}`).innerText = formatK(d.down);
            }
        });
    }

    // ১. অটোমেটিক স্ক্রোল করে মাঝখানে আনা
    setTimeout(() => {
        const card = document.getElementById(`search-card-${searchVal}`);
        if(card) {
            card.scrollIntoView({ behavior: "smooth", block: "center" });
            
            // ২. ১৫ সেকেন্ড পর হাইলাইট বর্ডার সরিয়ে ফেলা
            setTimeout(() => {
                card.classList.remove('neon-highlight-card');
                card.style.border = "1px solid #252525"; // নরমাল বর্ডার
            }, 15000); // ১৫০০০ মিলি-সেকেন্ড = ১৫ সেকেন্ড
        }
    }, 500);
}
// ক্যাটাগরি এবং ভিডিও লিস্ট
function filterCat(type, btn) {
    if(btn){ 
        document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active')); 
        btn.classList.add('active'); 
        document.getElementById("selectedCatName").innerText = btn.innerText.toUpperCase(); 
    }
    const grid = document.getElementById("allVideos");
    grid.innerHTML = ""; 
    Object.keys(videos).forEach(code => {
        const v = videos[code];
        if (type === 'all' || v.cat === type) {
            const shareLink = `${AD_CONFIG.botUrl}?startapp=${code}`;
            grid.insertAdjacentHTML('beforeend', `
                <div class="card" id="card-${code}">
                    <div class="card-img-box"><img src="${v.image}" loading="lazy"></div>
                    <div class="card-info">
                        <h3>${v.title}</h3>
                        <div class="meta-row"><span>📅 ${v.date}</span><span class="id-badge" onclick="copyId('${code}')">ID: ${code}</span></div>
                        <div class="stats-bar">
                            <div class="stat-group">
                                <div class="stat-item">👁️ <span id="v-${code}">0</span></div>
                                <div class="stat-item">📥 <span id="dn-${code}">0</span></div>
                            </div>
                        </div>
                        <button class="button" onclick="startUnlock('${code}')" id="btn-${code}">🔒 UNLOCK (${AD_CONFIG.requiredAdCount} ADS)</button>
                        <div class="share-row">
                            <button class="s-btn btn-link" onclick="copyLink('${code}')">Link</button>
                            <a class="s-btn btn-fb" href="https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(shareLink)}" target="_blank">FB</a>
                            <a class="s-btn btn-wa" href="https://api.whatsapp.com/send?text=${encodeURIComponent(shareLink)}" target="_blank">WA</a>
                        </div>
                    </div>
                </div>`);
            if(window.db) {
                window.onValue(window.ref(window.db, `stats/${code}`), (snap) => {
                    const d = snap.val(); if(d){
                        if(document.getElementById(`v-${code}`)) document.getElementById(`v-${code}`).innerText = formatK(d.v);
                        if(document.getElementById(`dn-${code}`)) document.getElementById(`dn-${code}`).innerText = formatK(d.down);
                    }
                });
            }
        }
    });
}

function init() {
    // স্লাইডার
    const topSlider = document.getElementById("topSlider");
    Object.keys(videos).slice(0, 15).forEach(code => {
        topSlider.innerHTML += `<div class="slide-card" onclick="startUnlock('${code}')"><img src="${videos[code].image}"><div class="overlay"><p>${videos[code].title}</p></div></div>`;
    });
    filterCat('all', document.querySelector('.cat-btn'));

    // ডিপ লিঙ্কিং চেক (বট থেকে আসলে)
    const urlParams = new URLSearchParams(window.location.search);
    const startApp = urlParams.get('startapp');
    if (startApp) {
        setTimeout(() => triggerSearch(startApp), 1000);
    }
}

function copyId(code) { navigator.clipboard.writeText(code); alert("ID: " + code + " Copied!"); }
function copyLink(code) { navigator.clipboard.writeText(`${AD_CONFIG.botUrl}?startapp=${code}`); alert("Link Copied!"); }

let checkFirebase = setInterval(() => { if (window.db && typeof videos !== 'undefined') { clearInterval(checkFirebase); init(); } }, 500);
document.getElementById("searchInput").addEventListener("input", function() { triggerSearch(this.value.toUpperCase()); });
</script>

<script>
const tg = window.Telegram.WebApp;
tg.ready();
tg.expand();

let adCounts = {};

// --- ২) ভিউ কাউন্ট ফরম্যাট ফাংশন (formatK) ---
function formatK(num) {
    if (!num) return 0;
    if (num >= 1000000) return (num / 1000000).toFixed(1) + 'M';
    if (num >= 1000) return (num / 1000).toFixed(1) + 'k';
    return num;
}

// --- ১) নতুন অ্যাড কিউ এবং ডাইরেক্ট লিঙ্ক লজিক ---
function startUnlock(code) {
    if (!adCounts[code]) {
        let adsList = [];
        let aCount = AD_CONFIG.adsgramCount;
        let mCount = AD_CONFIG.monetagCount;
        let total = aCount + mCount;

        for (let i = 0; i < total; i++) {
            if (i % 2 === 0 && aCount > 0) {
                adsList.push('adsgram');
                aCount--;
            } else if (mCount > 0) {
                adsList.push('monetag');
                mCount--;
            } else if (aCount > 0) {
                adsList.push('adsgram');
                aCount--;
            }
        }
        
        adCounts[code] = {
            totalAds: AD_CONFIG.adsgramCount + AD_CONFIG.monetagCount,
            doneAds: 0,
            doneDirect: 0,
            queue: adsList,
            currentIndex: 0
        };
    }

    const data = adCounts[code];
    const btn = document.getElementById(`btn-${code}`) || document.getElementById(`btn-s-${code}`);

    // ধাপ ১: সাধারণ অ্যাড দেখানো
    if (data.doneAds < data.totalAds) {
        const currentNetwork = data.queue[data.currentIndex];
        if (currentNetwork === 'adsgram') {
            const AdController = window.Adsgram.init({ blockId: AD_CONFIG.adsgramIds[0] });
            AdController.show().then(() => {
                data.doneAds++;
                data.currentIndex++;
                updateBtn(code, btn);
            }).catch(() => { tg.showAlert("বিজ্ঞাপনটি লোড হয়নি। আবার চেষ্টা করুন।"); });
        } 
        else if (currentNetwork === 'monetag') {
            const mZones = AD_CONFIG.monetagZones;
            const zoneToCall = mZones[data.currentIndex % mZones.length];
            const sdkFunc = `show_${zoneToCall}`;
            if (typeof window[sdkFunc] === 'function') {
                window[sdkFunc]().then(() => {
                    data.doneAds++;
                    data.currentIndex++;
                    updateBtn(code, btn);
                }).catch(() => {
                    data.doneAds++;
                    data.currentIndex++;
                    updateBtn(code, btn);
                });
            }
        }
    } 
    // ধাপ ২: ডাইরেক্ট লিঙ্ক লজিক
    else if (data.doneDirect < AD_CONFIG.directLinkCount) {
        window.open(AD_CONFIG.myDirectLink, '_blank');
        data.doneDirect++;
        updateBtn(code, btn);
    } 
    // ধাপ ৩: সব শেষ হলে প্লে বাটন
    else {
        showFinalPlay(code, btn);
    }
}

function updateBtn(code, btn) {
    const data = adCounts[code];
    const remAds = data.totalAds - data.doneAds;
    const remDirect = AD_CONFIG.directLinkCount - data.doneDirect;

    if (remAds > 0) {
        btn.innerText = `🔒 UNLOCK (${remAds} ADS LEFT)`;
    } else if (remDirect > 0) {
        btn.innerText = `⚡ VERIFY (${remDirect} STEP LEFT)`;
        btn.style.background = "linear-gradient(90deg, #f59e0b, #d97706)"; // বাটন কমলা হবে
    } else {
        showFinalPlay(code, btn);
    }
}

function showFinalPlay(code, btn) {
    if(window.db) { 
        window.runTransaction(window.ref(window.db, `stats/${code}`), (data) => { 
            if (!data) data = { v: 0, down: 0, l: 0, d: 0 }; 
            data.v = (data.v || 0) + 1; 
            data.down = (data.down || 0) + 1; 
            return data; 
        }); 
    }
    
    btn.innerText = "▶ PLAY NOW";
    btn.style.background = "linear-gradient(90deg, #10b981, #059669)";
    btn.onclick = () => { window.location.href = videos[code].final; };
}

// --- সার্চ এবং ফিল্টার ফাংশন (formatK সহ আপডেট) ---
function triggerSearch(val) {
    const resultDiv = document.getElementById("searchResult");
    if (typeof videos === 'undefined') return;
    const searchVal = val.trim().toUpperCase();
    if (!searchVal || !videos[searchVal]) {
        resultDiv.style.display = "none";
        return;
    }
    resultDiv.style.display = "block";
    const v = videos[searchVal];
    const shareLink = `${AD_CONFIG.botUrl}?startapp=${searchVal}`;
    const fbUrl = `https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(shareLink)}`;
    const waUrl = `https://api.whatsapp.com/send?text=${encodeURIComponent(shareLink)}`;
    resultDiv.innerHTML = `<div class='card neon-highlight-card' id='search-card-${searchVal}' style='margin-bottom:30px;'><div class="card-img-box"><img src="${v.image}"></div><div class='card-info'><h3 style="color:#ff0000; font-size:13px; letter-spacing:1px;">⚡ DIRECT MATCH FOUND</h3><h3>${v.title}</h3><div class="meta-row"><span>📅 ${timeAgo((v.date || "") + " " + (v.time || ""))}</span><span class="id-badge" onclick="copyId('${searchVal}')"># ID: ${searchVal} 📋</span></div><div class="stats-bar"><div class="stat-group"><div class="stat-item">👁️ <span id="sv-${searchVal}">0</span></div><div class="stat-item">📥 <span id="sdn-${searchVal}">0</span></div></div></div><button class='button' onclick="startUnlock('${searchVal}')" id="btn-s-${searchVal}">🔒 UNLOCK (${AD_CONFIG.requiredAdCount} ADS LEFT)</button><div class="share-row"><button class="s-btn btn-link" onclick="copyLink('${searchVal}')">Get Link</button><button class="s-btn btn-fb" onclick="openShare('${fbUrl}')">Facebook</button><button class="s-btn btn-wa" onclick="openShare('${waUrl}')">WhatsApp</button></div></div></div>`;
    
    if(window.db) {
        window.onValue(window.ref(window.db, `stats/${searchVal}`), (snap) => {
            const data = snap.val();
            if(data) {
                if(document.getElementById(`sv-${searchVal}`)) document.getElementById(`sv-${searchVal}`).innerText = formatK(data.v || 0);
                if(document.getElementById(`sdn-${searchVal}`)) document.getElementById(`sdn-${searchVal}`).innerText = formatK(data.down || 0);
            }
        });
    }
    resultDiv.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

function filterCat(type, btn) {
    if(btn){ 
        document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active')); 
        btn.classList.add('active'); 
        const displayName = document.getElementById("selectedCatName"); 
        if(displayName) displayName.innerText = btn.innerText.toUpperCase(); 
    }
    const grid = document.getElementById("allVideos");
    grid.innerHTML = ""; 
    Object.keys(videos).forEach(code => {
        const v = videos[code];
        if (type === 'all' || v.cat === type) {
            const userVote = localStorage.getItem(`voted_${code}`);
            const cardHTML = `<div class="card" id="card-${code}"><div class="card-img-box"><img src="${v.image}" loading="lazy"></div><div class="card-info"><h3>${v.title}</h3><div class="meta-row"><span>📅 ${timeAgo(v.date + " " + (v.time || ""))}</span><span class="id-badge" onclick="copyId('${code}')"># ID: ${code} 📋</span></div><div class="stats-bar"><div class="stat-group"><div class="stat-item">👁️ <span id="v-${code}">0</span></div><div class="stat-item">📥 <span id="dn-${code}">0</span></div></div><div class="stat-group"><div class="stat-item ${userVote==='like'?'active-like':''}" onclick="handleVote('${code}','like')">👍 <span id="l-${code}">0</span></div><div class="stat-item ${userVote==='dislike'?'active-dis':''}" onclick="handleVote('${code}','dislike')">👎 <span id="d-${code}">0</span></div></div></div><button class="button" onclick="startUnlock('${code}')" id="btn-${code}">🔒 UNLOCK (${AD_CONFIG.requiredAdCount} ADS LEFT)</button><div class="share-row"><button class="s-btn btn-link" onclick="copyLink('${code}')">Get Link</button><button class="s-btn btn-fb" onclick="openShare('https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(AD_CONFIG.botUrl + "?startapp=" + code)}')">Facebook</button><button class="s-btn btn-wa" onclick="openShare('https://api.whatsapp.com/send?text=${encodeURIComponent(AD_CONFIG.botUrl + "?startapp=" + code)}')">WhatsApp</button></div></div></div>`;
            grid.insertAdjacentHTML('beforeend', cardHTML);
            if(window.db) { 
                window.onValue(window.ref(window.db, `stats/${code}`), (snap) => { 
                    const val = snap.val(); 
                    if(val){ 
                        if(document.getElementById(`v-${code}`)) document.getElementById(`v-${code}`).innerText = formatK(val.v || 0); 
                        if(document.getElementById(`dn-${code}`)) document.getElementById(`dn-${code}`).innerText = formatK(val.down || 0); 
                        if(document.getElementById(`l-${code}`)) document.getElementById(`l-${code}`).innerText = formatK(val.l || 0); 
                        if(document.getElementById(`d-${code}`)) document.getElementById(`d-${code}`).innerText = formatK(val.d || 0); 
                    } 
                }); 
            }
        }
    });
}

function init() {
    const topSlider = document.getElementById("topSlider");
    if (topSlider) {
        topSlider.innerHTML = ""; 
        Object.keys(videos).slice(0, 15).forEach(code => {
            topSlider.innerHTML += `<div class="slide-card" onclick="startUnlock('${code}')"><img src="${videos[code].image}"><div class="overlay"><p>${videos[code].title}</p></div></div>`;
        });
    }
    filterCat('all', document.querySelector('.cat-btn'));
}

function copyId(code) { navigator.clipboard.writeText(code); alert("ID: " + code + " Copied! ✅"); }
function copyLink(code) { const link = `${AD_CONFIG.botUrl}?startapp=${code}`; navigator.clipboard.writeText(link).then(() => { alert("লিংক কপি হয়েছে! ✅"); }); }
function openShare(url) { window.open(url, '_blank'); }
let checkFirebase = setInterval(() => { if (window.db) { clearInterval(checkFirebase); init(); } }, 500);

function timeAgo(dateString) {
    const now = new Date(); const past = new Date(dateString); const diffInSeconds = Math.floor((now - past) / 1000);
    if (isNaN(past)) return dateString; 
    const intervals = { year: 31536000, month: 2592000, week: 604800, day: 86400, hour: 3600, minute: 60 };
    if (diffInSeconds < 60) return "Just Now";
    if (diffInSeconds < intervals.hour) return Math.floor(diffInSeconds / intervals.minute) + " mins ago";
    if (diffInSeconds < intervals.day) return Math.floor(diffInSeconds / intervals.hour) + " hours ago";
    if (diffInSeconds < intervals.week) return Math.floor(diffInSeconds / intervals.day) + " days ago";
    return past.toLocaleDateString('en-GB'); 
}

document.getElementById("searchInput").addEventListener("input", function() { triggerSearch(this.value.trim().toUpperCase()); });
</script>

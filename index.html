<body oncontextmenu="return false;" onkeydown="return false;">

<div class="header">
    <div class="logo">ENJOY ALL</div>
    <input type="text" class="search" placeholder="Search Code..." id="searchInput">
</div>

<div class="container">
    <div id="searchResult"></div>
    <div id="featuredArea">
        <div class="section-title">Featured</div>
        <div class="slider-container" id="topSlider"></div>
    </div>
    <div class="section-title">Categories</div>
    <div class="cat-box" style="display: flex; gap: 10px; overflow-x: auto; padding: 10px 0;">
        <button class="cat-btn active" onclick="filterCat('all', this)">All Episodes</button>
        <button class="cat-btn" onclick="filterCat('tiktok', this)">TikTok Viral</button>
        <button class="cat-btn" onclick="filterCat('others', this)">Others Link</button>
    </div>

    <div id="selectedCatName" class="active-cat-title">ALL EPISODES</div>
    <div class="video-grid" id="allVideos"></div>
</div>

<div class="nav">
    <a href="index.html" class="active">🏠 Home</a>
    <a href="browser.html">🌐 Browser</a>
    <a href="profile.html">👤 Profile</a>
    <a href="support.html">🛠 Support</a>
</div>

<script>
let adStatus = {};
const tg = window.Telegram.WebApp;
tg.ready(); tg.expand();

// ১. স্মার্ট অ্যাড কিউ তৈরির ফাংশন
function createAdQueue() {
    let queue = [];
    for(let i=0; i < AD_CONFIG.adsgramCount; i++) queue.push('adsgram');
    for(let i=0; i < AD_CONFIG.monetagCount; i++) queue.push('monetag');
    for(let i=0; i < AD_CONFIG.directLinkCount; i++) queue.push('direct');
    return queue;
}

// ২. আনলক ফাংশন (নতুন লজিক)
function startUnlock(code) {
    if (!adStatus[code]) {
        adStatus[code] = {
            rem: AD_CONFIG.requiredAdCount,
            list: createAdQueue()
        };
    }

    const btn = document.getElementById(`btn-${code}`) || document.getElementById(`btn-s-${code}`);
    const currentAdIndex = AD_CONFIG.requiredAdCount - adStatus[code].rem;
    const currentAdType = adStatus[code].list[currentAdIndex];

    if (currentAdType === 'adsgram') {
        const id = AD_CONFIG.adsgramIds[Math.floor(Math.random() * AD_CONFIG.adsgramIds.length)];
        if (window.Adsgram) {
            window.Adsgram.init({ blockId: id }).show()
                .then(() => handleAds(code, btn))
                .catch(() => showFallbackMonetag(code, btn));
        } else { showFallbackMonetag(code, btn); }
    } 
    else if (currentAdType === 'monetag') {
        showFallbackMonetag(code, btn);
    } 
    else if (currentAdType === 'direct') {
        window.open(AD_CONFIG.myDirectLink, '_blank');
        handleAds(code, btn);
    }
}

function showFallbackMonetag(code, btn) {
    const zone = AD_CONFIG.monetagZones[Math.floor(Math.random() * AD_CONFIG.monetagZones.length)];
    if (typeof window[`show_${zone}`] === 'function') {
        window[`show_${zone}`]().then(() => handleAds(code, btn)).catch(() => handleAds(code, btn));
    } else { handleAds(code, btn); }
}

function handleAds(code, btn) {
    adStatus[code].rem--;
    if (adStatus[code].rem > 0) {
        btn.innerText = `🔒 UNLOCK (${adStatus[code].rem} ADS LEFT)`;
    } else {
        if(window.db) {
            window.runTransaction(window.ref(window.db, `stats/${code}`), (data) => {
                if (!data) data = { v: 0, down: 0, l: 0, d: 0 };
                data.v = (data.v || 0) + 1;
                data.down = (data.down || 0) + 1;
                return data;
            });
        }
        btn.innerText = "▶ PLAY VIDEO";
        btn.style.background = "#28a745";
        btn.onclick = () => { window.location.href = videos[code].final; };
    }
}

// ৩. সার্চ এবং ফিল্টার (আপনার আগের ডিজাইনের মতো)
function triggerSearch(val) {
    const resultDiv = document.getElementById("searchResult");
    if (typeof videos === 'undefined') return;
    const searchVal = val.trim().toUpperCase();
    if (!searchVal || !videos[searchVal]) { resultDiv.style.display = "none"; return; }
    resultDiv.style.display = "block";
    const v = videos[searchVal];
    resultDiv.innerHTML = `<div class='card neon-highlight-card' id='search-card-${searchVal}' style='margin-bottom:30px;'><div class="card-img-box"><img src="${v.image}"></div><div class='card-info'><h3>${v.title}</h3><button class='button' onclick="startUnlock('${searchVal}')" id="btn-s-${searchVal}">🔒 UNLOCK (${AD_CONFIG.requiredAdCount} ADS)</button></div></div>`;
    resultDiv.scrollIntoView({ behavior: 'smooth' });
}

function filterCat(type, btn) {
    if(btn) { document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active')); btn.classList.add('active'); }
    const grid = document.getElementById("allVideos");
    grid.innerHTML = "";
    Object.keys(videos).forEach(code => {
        const v = videos[code];
        if (type === 'all' || v.cat === type) {
            grid.insertAdjacentHTML('beforeend', `<div class="card" id="card-${code}"><div class="card-img-box"><img src="${v.image}" loading="lazy"></div><div class="card-info"><h3>${v.title}</h3><div class="meta-row"><span># ID: ${code}</span></div><button class="button" onclick="startUnlock('${code}')" id="btn-${code}">🔒 UNLOCK (${AD_CONFIG.requiredAdCount} ADS)</button></div></div>`);
        }
    });
}

function init() {
    const topSlider = document.getElementById("topSlider");
    Object.keys(videos).slice(0, 15).forEach(code => {
        topSlider.innerHTML += `<div class="slide-card" onclick="startUnlock('${code}')"><img src="${videos[code].image}"><div class="overlay"><p>${videos[code].title}</p></div></div>`;
    });
    filterCat('all');
}

let checkFirebase = setInterval(() => { if (window.db && typeof videos !== 'undefined') { clearInterval(checkFirebase); init(); } }, 500);
document.getElementById("searchInput").addEventListener("input", function() { triggerSearch(this.value.trim().toUpperCase()); });
</script>

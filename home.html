    <style>

<div class="container">

<script>
// --- গ্লোবাল ভেরিয়েবল ---
let adCounts = {};
const tg = window.Telegram.WebApp;
tg.ready();
tg.expand();

// --- প্রধান আনলক লজিক (config.js এর লজিক অনুযায়ী) ---
function startUnlock(code) {
    if (!adCounts[code]) adCounts[code] = AD_CONFIG.requiredAdCount;
    const btn = document.getElementById(`btn-${code}`) || document.getElementById(`btn-s-${code}`);
    
    // বর্তমানে কত নম্বর অ্যাড চলছে
    const currentAdNumber = (AD_CONFIG.requiredAdCount - adCounts[code]) + 1;

    // ৩-রোটেশন লজিক (Adsgram -> Monetag -> Direct Link)
    let rotationPos = currentAdNumber % 3;

    if (rotationPos === 1) {
        // ১. Adsgram ভিডিও অ্যাড
        const randomId = AD_CONFIG.adsgramIds[Math.floor(Math.random() * AD_CONFIG.adsgramIds.length)];
        if (window.Adsgram) {
            window.Adsgram.init({ blockId: randomId }).show()
                .then(() => handleAds(code, btn))
                .catch(() => alert("ভিডিও অ্যাডটি পুরোপুরি দেখুন!"));
        } else { handleAds(code, btn); }
    } 
    else if (rotationPos === 2) {
        // ২. Monetag SDK (15s Ad)
        const zone = AD_CONFIG.monetagZones[Math.floor(Math.random() * AD_CONFIG.monetagZones.length)];
        if (typeof window[`show_${zone}`] === 'function') {
            window[`show_${zone}`]().then(() => handleAds(code, btn)).catch(() => handleAds(code, btn));
        } else { handleAds(code, btn); }
    } 
    else {
        // ০ বা ৩. Direct Link (যদি অন থাকে তবে ওপেন হবে, অফ থাকলে ভিডিও দেখাবে)
        if (AD_CONFIG.isDirectLinkEnabled) {
            window.open(AD_CONFIG.myDirectLink, '_blank');
            handleAds(code, btn);
        } else {
            // ডিরেক্ট লিঙ্ক অফ থাকলে ব্যাকআপ হিসেবে Adsgram দেখাবে
            const randomId = AD_CONFIG.adsgramIds[0];
            if (window.Adsgram) {
                window.Adsgram.init({ blockId: randomId }).show().then(() => handleAds(code, btn));
            } else { handleAds(code, btn); }
        }
    }
}

function handleAds(code, btn) {
    adCounts[code]--;
    if (adCounts[code] > 0) {
        btn.innerText = `🔒 UNLOCK (${adCounts[code]} ADS LEFT)`;
    } else {
        // Firebase এ ভিউ কাউন্ট আপডেট
        if(window.db) {
            window.runTransaction(window.ref(window.db, `stats/${code}`), (data) => {
                if (!data) data = { v: 0, down: 0, l: 0, d: 0 };
                data.v = (data.v || 0) + 1;
                data.down = (data.down || 0) + 1;
                return data;
            });
        }
        btn.innerText = "▶ PLAY VIDEO";
        btn.style.background = "linear-gradient(90deg, #28a745, #1e7e34)";
        btn.onclick = () => { window.location.href = videos[code].final; };
    }
}

// --- আপনার আগের সব সাপোর্টিং ফাংশন (টাইমিং, ভোট, সার্চ) ---
function timeAgo(dateString) {
    const now = new Date(); const past = new Date(dateString);
    const diff = Math.floor((now - past) / 1000);
    if (isNaN(past)) return dateString;
    if (diff < 60) return "Just Now";
    if (diff < 3600) return Math.floor(diff / 60) + " mins ago";
    if (diff < 86400) return Math.floor(diff / 3600) + " hours ago";
    return past.toLocaleDateString('en-GB');
}

function triggerSearch(val) {
    const resultDiv = document.getElementById("searchResult");
    if (typeof videos === 'undefined') return;
    const searchVal = val.trim().toUpperCase();
    if (!searchVal || !videos[searchVal]) { resultDiv.style.display = "none"; return; }
    resultDiv.style.display = "block";
    const v = videos[searchVal];
    resultDiv.innerHTML = `<div class='card neon-highlight-card' id='search-card-${searchVal}' style='margin-bottom:30px;'><div class="card-img-box"><img src="${v.image}" style="width:100%;"></div><div class='card-info'><h3>${v.title}</h3><button class='button' onclick="startUnlock('${searchVal}')" id="btn-s-${searchVal}">🔒 UNLOCK (${AD_CONFIG.requiredAdCount} ADS)</button></div></div>`;
    resultDiv.scrollIntoView({ behavior: 'smooth' });
}

function filterCat(type, btn) {
    if(btn) {
        document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        document.getElementById("selectedCatName").innerText = btn.innerText.toUpperCase();
    }
    const grid = document.getElementById("allVideos");
    grid.innerHTML = "";
    Object.keys(videos).forEach(code => {
        const v = videos[code];
        if (type === 'all' || v.cat === type) {
            grid.insertAdjacentHTML('beforeend', `<div class="card" id="card-${code}"><img src="${v.image}" loading="lazy"><div class="card-info"><h3>${v.title}</h3><div class="meta-row" style="display:flex; justify-content:space-between; font-size:11px; color:#888; margin:10px 0;"><span>📅 ${timeAgo(v.date + " " + (v.time || ""))}</span><span class="id-badge"># ID: ${code}</span></div><button class="button" onclick="startUnlock('${code}')" id="btn-${code}">🔒 UNLOCK (${AD_CONFIG.requiredAdCount} ADS)</button></div></div>`);
        }
    });
}

function init() {
    const topSlider = document.getElementById("topSlider");
    if (topSlider) {
        Object.keys(videos).slice(0, 15).forEach(code => {
            topSlider.innerHTML += `<div class="slide-card" onclick="startUnlock('${code}')"><img src="${videos[code].image}"><div class="overlay" style="position:absolute; bottom:0; padding:10px; background:rgba(0,0,0,0.6); width:100%;"><p style="font-size:10px; margin:0;">${videos[code].title}</p></div></div>`;
        });
    }
    filterCat('all', document.querySelector('.cat-btn'));
}

let checkFirebase = setInterval(() => { if (window.db && typeof videos !== 'undefined') { clearInterval(checkFirebase); init(); } }, 500);
document.getElementById("searchInput").addEventListener("input", function() { triggerSearch(this.value); });
</script>
